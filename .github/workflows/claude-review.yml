name: Claude review

# Reviews every PR with a fresh Claude that has no memory of writing the code.
# That independence is the point: a model reviewing its own work in the same
# session re-checks its own assumptions with the same blind spots that produced
# them. This one only sees the diff.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required: the action exchanges a GitHub OIDC token for its App token, and
  # fails at startup without this.
  id-token: write

# One review per branch at a time; a new push supersedes the review in flight.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the reviewer can diff against the base branch.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*)"
          prompt: |
            Review this pull request as a careful senior engineer on the Humo
            project. Be direct and specific. Praise nothing; say what is wrong,
            or say it looks correct.

            Read CLAUDE.md first — it is the project's binding conventions —
            and the relevant file in /docs before judging a design choice. A
            decision that looks odd may be recorded there with its rationale;
            argue with the rationale rather than the code if you disagree.

            Focus, in priority order:

            1. CORRECTNESS. Bugs, wrong logic, unhandled edge cases. State a
               concrete failing input or sequence, not a vague worry.
            2. THE PROJECT'S HARD RULES, which are not style preferences here:
               - Temperatures stored in Celsius everywhere, converted only at
                 display. A degrees-F value reaching storage is a defect.
               - Temperature deltas must not have the 32-degree offset applied.
               - Every user-facing string comes from .resx. A literal in XAML or
                 a ViewModel is a defect, as is an English string added without
                 its Spanish counterpart in the same commit.
               - No logic in code-behind beyond the constructor.
               - Humo.Core must not reference Microsoft.Maui.*.
               - Record IDs are client-generated GUIDs; timestamps are UTC.
               - The API derives the account ID from the token, never the body.
            3. TESTS. Every feature ships with tests in the same commit, and
               they must cover edge cases, not just the happy path. See
               docs/testing.md for the ones that recur in this domain. Missing
               edge-case coverage is a finding, not a nitpick.
            4. Anything that would fail CI, or that silently weakens a check.

            Ignore formatting and naming unless they impede comprehension.

            When you are done, decide:

            - If you found NOTHING blocking, approve:
                gh pr review --approve --body "<one paragraph on what you
                verified and what you deliberately did not>"
            - If you found anything blocking, DO NOT approve. Request changes:
                gh pr review --request-changes --body "<the findings>"
            - If your concerns are real but not blocking, leave a comment
                review instead: gh pr review --comment --body "..."

            Approving means you would merge this yourself and stand behind it.
            Do not approve to be agreeable, and do not approve work you could
            not verify — say what you could not check instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

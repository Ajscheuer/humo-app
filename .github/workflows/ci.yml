name: CI

# Three jobs, split by what each platform can actually prove:
#
#   test     (Linux) — the 93 unit tests. Fast, and the only job that gates
#                      every push.
#   android  (Linux) — builds the MAUI app for Android. Deliberately NOT on the
#                      macOS runner: Linux minutes bill at 1x and macOS at 10x,
#                      and Android builds identically on both.
#   ios      (macOS) — the only thing that genuinely needs a Mac. Apple ships the
#                      iOS SDK for macOS only, so this is the sole job that can
#                      compile Platforms/iOS and process Info.plist.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run already in flight. Matters most
# for the macOS job, which is the expensive one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Humo.NoMaui.slnf excludes only the app project, so this runs the full
      # test suite without needing the MAUI workload — which is the whole point
      # of keeping ViewModels in Humo.Core.
      - name: Test
        run: dotnet test Humo.NoMaui.slnf --configuration Release

  android:
    name: Build app (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # .NET 10 targets a newer Android API level than the runner image ships
      # with, so the platform has to be fetched before the build.
      - name: Install Android SDK dependencies
        run: >
          dotnet build src/Humo.App/Humo.App.csproj
          -f net10.0-android
          -t:InstallAndroidDependencies
          -p:AcceptAndroidSDKLicenses=True

      - name: Build
        run: dotnet build src/Humo.App/Humo.App.csproj -f net10.0-android --configuration Release

  ios:
    name: Build app (iOS)
    # macos-26, not macos-15: .NET 10's iOS workload requires Xcode 26.6, and the
    # macos-15 image tops out at Xcode 16.4. This is a hard toolchain floor, not
    # a preference — the build refuses to run on an older Xcode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      # Pick an Xcode by capability, not by version number. Two things have to
      # be true and neither is implied by the other:
      #
      #   1. New enough for the iOS workload (.NET 10 requires Xcode 26.6+).
      #   2. Carries the macOS platform SDK — actool, the asset catalog
      #      compiler, runs as a macOS tool and fails with "unable to find
      #      utility actool" without it.
      #
      # Runner images ship several Xcodes and not all are complete, so simply
      # taking the highest version number selects a broken toolchain. Walk them
      # newest-first and take the first one that actually has the macOS SDK.
      - name: Select a usable Xcode
        run: |
          echo "Available Xcode installs:"
          for app in /Applications/Xcode*.app; do
            [ -e "$app" ] || continue
            if [ -d "$app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              echo "  $app (has macOS SDK)"
            else
              echo "  $app (NO macOS SDK)"
            fi
          done

          selected=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              selected="$app"
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "::error::No Xcode on this runner has the macOS platform SDK, which actool requires."
            exit 1
          fi

          echo "Selecting $selected"
          sudo xcode-select -s "$selected"
          xcodebuild -version

          # Fail here, with a clear message, rather than deep inside actool.
          xcrun --find actool

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Built for the simulator so no signing identity or provisioning profile
      # is needed. This still compiles Platforms/iOS and processes Info.plist,
      # which is everything CI can usefully check without Apple credentials.
      - name: Build
        run: >
          dotnet build src/Humo.App/Humo.App.csproj
          -f net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
          --configuration Release
